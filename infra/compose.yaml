# The whole system in one command:
#
#   BUILD_REVISION=$(git rev-parse HEAD) docker compose -f infra/compose.yaml up --build
#
# Then the dashboard is at http://127.0.0.1:8080 and the API at
# http://127.0.0.1:3000. Nothing else is needed on the machine — no pnpm, no
# Node, no Xcode.
#
# Two properties are deliberate and both cost something:
#
#   - No reverse proxy, so the browser reaches the API across an origin
#     boundary exactly as it does in development. A proxy would be one fewer
#     port to explain and would erase the crossing the C13 smoke exists to
#     prove (docs/DECISIONS.md #21).
#   - No host bind mounts. Every file a container needs is copied into its
#     image, because Colima and Docker Desktop differ on mount semantics and a
#     stack that depends on them is a stack that runs on one laptop.
#
# There is no service-to-service traffic here at all: the browser talks to both
# containers and they never talk to each other. That is a consequence of the
# first property rather than an accident, and it is why no service name appears
# in any address below.

name: maekbeat

services:
  server:
    build:
      context: ..
      dockerfile: infra/server.Dockerfile
      args:
        # No default. An unset BUILD_REVISION stops the build with this
        # message rather than producing an image that cannot say what it is.
        BUILD_REVISION: ${BUILD_REVISION:?set it to the commit being built, e.g. BUILD_REVISION=$(git rev-parse HEAD)}
    image: maekbeat-server:compose
    environment:
      # The image already sets NODE_ENV, HOST, PORT and BUILD_REVISION; what is
      # here is what a deployment decides rather than what the image is.
      - LOG_LEVEL=info
      # The dashboard's two host origins, spelled out. `*` would work and would
      # make the C13 origin assertion unfalsifiable — the allowlist is only a
      # guard if removing an entry breaks something (docs/DECISIONS.md #21).
      - CORS_ORIGIN=http://127.0.0.1:8080,http://localhost:8080
      # Passed through from the shell, and absent from the container when it is
      # absent from the shell — which is why this list is a list. Written as
      # `KEY: ${VAR:-}` it would reach the server as an empty string, and the
      # environment contract rejects that with a startup error rather than
      # reading it as "off" (apps/server/src/config.ts). infra/load.sh sets it
      # for the traced half of the tracing-cost measurement and leaves it unset
      # for the other half.
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
    ports:
      # Loopback only. This server authenticates nobody (SECURITY.md), so it
      # has no business being reachable from the network the laptop is on.
      - "127.0.0.1:3000:3000"
    # Matches `docker compose stop -t 10`. The server closes its listener,
    # destroys any WebSocket peer that ignores the close frame, and flushes
    # tracing (apps/server/src/lifecycle.ts); ten seconds is the budget in
    # which all three must finish, and infra/compose-smoke.sh asserts that a
    # deliberately rude client does not push it past that into a SIGKILL.
    stop_grace_period: 10s

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:?set it to the commit being built, e.g. BUILD_REVISION=$(git rev-parse HEAD)}
        # Compiled into the bundle, so it is the address the browser uses.
        VITE_API_BASE_URL: http://127.0.0.1:3000
    image: maekbeat-web:compose
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      server:
        # The dashboard's first paint reads /devices. Starting it before the
        # API answers would make the stack's first thirty seconds look like the
        # failure state the C13 suite has a test for.
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # The load rig. Behind a profile, so `docker compose up` still starts exactly
  # the two services the stack is: `docker compose --profile load ...` is the
  # only way to reach anything below, and infra/load.sh is what drives it.
  #
  # This is also the first service-to-service traffic in the file, and it is not
  # a reversal of docs/DECISIONS.md #21. That decision is about the browser's
  # path to the API — no proxy, two origins, the crossing left observable. A
  # load generator is not a browser, and pushing it through the host's published
  # port would measure the port forward as well as the server.
  # ---------------------------------------------------------------------------
  k6:
    profiles: ["load"]
    build:
      context: ..
      dockerfile: infra/k6.Dockerfile
    image: maekbeat-k6:compose
    environment:
      - API_URL=ws://server:3000
      - RUN_MS
      - RATE_HZ
      - VUS
      - DEVICES
      - DEVICES_PER_VU
      - BREACH
      - ACK_P95_MS
      - FANOUT_P95_MS
    depends_on:
      server:
        condition: service_healthy

  # A collector that accepts every OTLP export and keeps nothing. The tracing
  # cost being measured is the server's — serialising spans, batching them and
  # posting them — and a real backend would add its own latency to a number
  # that is supposed to be about this server.
  collector:
    profiles: ["load"]
    image: node:22.22.0-alpine3.22
    command:
      - node
      - -e
      - |
        require("http")
          .createServer((req, res) => {
            req.resume();
            req.on("end", () => {
              res.writeHead(200, { "content-type": "application/json" });
              res.end("{}");
            });
          })
          .listen(4318, "0.0.0.0");
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(4318,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 5

  # The subscriber that stops reading, on the compose network. It cannot be run
  # from the host: a published port is a proxy that drains the server's socket
  # for you, so a host-side stalled client produces no backpressure at all
  # (infra/stalled.Dockerfile records the measurement).
  stalled:
    profiles: ["load"]
    build:
      context: ..
      dockerfile: infra/stalled.Dockerfile
    image: maekbeat-stalled:compose
    # Fixed arguments rather than a `run` invocation: `docker compose run -d`
    # does not hand back a usable container id, and reading this peer's log is
    # how the comparison knows it ever attached.
    command: ["server", "3000", "k6-fanout-0"]
    depends_on:
      server:
        condition: service_healthy
