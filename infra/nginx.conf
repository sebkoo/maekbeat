# Static serving for the apps/web bundle, copied into the image at build time
# (infra/web.Dockerfile). No bind mount: the container must carry its own
# configuration, because Colima and Docker Desktop do not agree on host mount
# semantics and a stack that depends on them runs on one machine.
#
# This is not a reverse proxy and must not become one. The dashboard reaches
# apps/server across an origin boundary, and the C13 smoke exists to prove that
# crossing works; a `location /api/` here would erase it and leave the suite
# passing (docs/DECISIONS.md #21).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed filenames under /assets, so a name that
    # resolves is immutable and a name that does not is a 404 rather than a
    # page. Falling back to index.html here is what turns a broken asset base
    # path into a silent blank screen — the C13 failure, one layer down.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry document names the current bundle, so caching it is caching the
    # answer to "which build is this".
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # react-router owns every other path (apps/web/src/main.tsx), so an unknown
    # URL is a client route and not a missing file.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
