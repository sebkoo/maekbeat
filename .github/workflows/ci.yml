name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default, so the one job that needs to write says so itself. Every
# job below reads the repository and nothing else; `publish` adds
# `packages: write` in its own block and is the only place that token can push
# anything anywhere.
permissions:
  contents: read

jobs:
  # Proves every commit message in history is trailer-free (G1) and Conventional-Commit
  # formed (G2), that the commit-msg hook itself still enforces both, and that the
  # README's three statements of each app's shipped commit range still agree —
  # the board rule covered the progress board only, and the Stack table drifted
  # two commits behind the tour above it before anything noticed (C14). Since
  # C19 it also proves every commit the roadmap calls shipped is linked from the
  # board, and that every link resolves to an ancestor of HEAD — which needs the
  # fetch-depth: 0 checkout below.
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/test-githooks.sh
      - run: bash scripts/check-commit-hygiene.sh
      - run: bash scripts/check-scope-ranges.sh
      # Every commit the roadmap calls shipped is linked from the board, and
      # every link resolves to an ancestor of HEAD. The board went eleven
      # commits with no chips at all — a commit cannot link itself, so the job
      # always falls to a later one and nothing was making it happen.
      - run: bash scripts/check-commit-links.sh
      # Every reference to an action names the same version. Dependabot bumped
      # setup-node to v7 across the workflow, and a job added three commits
      # later reintroduced v4 by copying an older step — the runner said so in a
      # deprecation warning and a warning in a green log is a thing nobody
      # reads. The rule is internal consistency, deliberately not newness; the
      # blind spot that leaves is written down in the script.
      - run: bash scripts/check-action-versions.sh
      # Every hazard row in docs/regulatory/hazard-analysis.md cites the test
      # that demonstrates its control, and this fails the build when one of
      # those citations stops resolving — a missing file, a renamed test, a
      # skipped one, or a row citing nothing at all. A regulatory document
      # rots because nothing connects it to the system it describes; this is
      # the connection, and it is why C20 is engineering rather than paperwork.
      - run: bash scripts/check-hazard-tests.sh

  # Proves the workspace packages pass their vitest suites and typechecks (first package: C1).
  # Since C9 the suites run once, coverage-enabled: each package's vitest.config.ts
  # thresholds sit just under its measured floor, so a coverage regression fails this job.
  tests:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # pnpm -r silently skips packages without the script, so a package could
      # drop out of the gate with green CI. Assert every workspace package
      # carries test:coverage before running it (CLAUDE.md ratchet policy).
      # Pathspecs mirror the pnpm-workspace.yaml globs, infra included, so a
      # package added there cannot be gate-exempt. git grep reads tracked files
      # only, which is exactly right in CI (checkout materialises nothing else)
      # but means this step is not a local pre-commit check for a new package.
      - run: |
          pkgs='apps/*/package.json packages/*/package.json infra/package.json infra/*/package.json'
          missing=$(git grep -L '"test:coverage"' -- $pkgs || true)
          if [ -n "$missing" ]; then
            echo "packages missing the test:coverage gate: $missing"
            exit 1
          fi
          # The Codecov files list below is hand-written; a package absent from
          # it uploads nothing while every gate stays green, which is the same
          # silent drop-out one layer down. Assert each gated package is listed.
          for pkg in $(git grep -l '"test:coverage"' -- $pkgs); do
            dir=$(dirname "$pkg")
            grep -q "$dir/coverage/lcov.info" .github/workflows/ci.yml || {
              echo "coverage report for $dir is not uploaded in .github/workflows/ci.yml"
              exit 1
            }
          done
          # Everything above assumes a directory pnpm can see. apps/ios (C14) is
          # the first that it cannot: no package.json, so `pnpm -r` skips it
          # silently and the two checks above have nothing to say about it —
          # the exact hole C9 closed for the web, reopened by a new language.
          # So every non-Node directory under apps/, packages/ or infra/ must
          # name the gate that covers it, and the catch-all fails a new one by
          # default — including one in a language nobody has added yet.
          for dir in apps/* packages/* infra/*; do
            [ -d "$dir" ] || continue
            [ -f "$dir/package.json" ] && continue
            case "$dir" in
              apps/ios)
                # Anchored to the step as CI would execute it, not to the
                # substring: an unanchored grep for this path matches the
                # guard's own line, so deleting the whole ios job below would
                # leave this check applauding itself.
                grep -qE '^ *- run: apps/ios/scripts/test\.sh *$' .github/workflows/ci.yml || {
                  echo "no step in this workflow runs the apps/ios test + coverage gate"
                  exit 1
                }
                # Likewise anchored: "|| true" appended to the call, or the call
                # replaced by a comment mentioning it, must not pass.
                grep -qE '^"\$here/coverage-gate\.sh" "\$result"$' apps/ios/scripts/test.sh || {
                  echo "apps/ios/scripts/test.sh no longer runs the coverage gate unconditionally"
                  exit 1
                }
                ;;
              infra/k6)
                # The k6 profiles are the one directory here whose answer to
                # "which gate covers it" is "none, deliberately" — they run
                # under a load generator that reports and gates nothing
                # (docs/DECISIONS.md #24), so there is no coverage number to
                # ratchet and inventing one would be a G3 event.
                #
                # What is checked instead is that they are not dead code: every
                # .js file in the directory must be invoked by infra/load.sh,
                # which is the only documented way to run them. A profile added
                # and never wired fails here, and so does a runner that stops
                # calling one. Anchored to `run_k6 <name> <file>` rather than to
                # the bare filename, so a mention in a comment does not pass.
                for profile in infra/k6/*.js; do
                  grep -qE "^run_k6 [a-z0-9-]+ $(basename "$profile") " infra/load.sh || {
                    echo "infra/load.sh never runs $profile"
                    exit 1
                  }
                done
                ;;
              *)
                echo "$dir is neither a pnpm package nor a directory this guard"
                echo "knows how to gate. Add its gate, then name it here."
                exit 1
                ;;
            esac
          done
      # The action-version guard runs in the hygiene job above. It is asserted
      # from this job rather than from inside itself, because a guard asked to
      # confirm its own wiring says nothing at all when the wiring is what was
      # deleted — the same reason the ios gate is asserted from here and not
      # from apps/ios. Anchored as CI would execute it, so a mention in a
      # comment or a call with "|| true" appended does not pass.
      - run: |
          grep -qE '^ *- run: bash scripts/check-action-versions\.sh *$' .github/workflows/ci.yml || {
            echo "no step in this workflow runs scripts/check-action-versions.sh"
            exit 1
          }
      - run: pnpm -r test:coverage
      - run: pnpm -r typecheck
      # `cdk synth` as the CLI actually invokes it, which is one step and not a
      # job on purpose. The synthesis is not new coverage: the suite above
      # already synthesizes the app infra/cdk/src/main.ts builds, cdk-nag
      # included — removing one acknowledgement from src/suppressions.ts fails
      # it with ValidationFailed raised inside Template.fromStack, which is what
      # a synth does with a finding. What no test in that package can see is the
      # wrapper: cdk.json's `app` command, tsx resolving it, and the aws-cdk CLI
      # agreeing with aws-cdk-lib. Pointed at a file that does not exist,
      # cdk.json left all 28 tests passing while this command failed
      # (docs/DECISIONS.md #31).
      #
      # Neither input has a default, by design. Nothing here is deployed, so any
      # well-formed certificate ARN synthesizes (infra/cdk/README.md); the
      # revision is the real one, so a synth cannot pass on a value the rest of
      # this workflow would reject.
      - run: |
          BUILD_REVISION="$(git rev-parse HEAD)" \
          API_CERTIFICATE_ARN="arn:aws:acm:eu-west-1:111122223333:certificate/11111111-2222-3333-4444-555555555555" \
            pnpm --filter @maekbeat/infra-cdk synth
      # Badge #6 data source: the upload feeds the README Codecov badge, which
      # renders the last uploaded number and shows "unknown" when none exists.
      # fail_ci_if_error keeps a silent upload failure from leaving the badge
      # quietly stale. The token secret is optional for a public repository;
      # setting CODECOV_TOKEN removes tokenless-upload rate limits.
      #
      # Skipped where the token cannot exist. Checked 2026-08-05 against
      # GitHub's documented behaviour: Actions secrets are withheld from pull
      # requests opened off forks, and Dependabot-triggered runs read a separate
      # Dependabot secret store — so fail_ci_if_error would fail healthy
      # contributions once C23 opens the repo. Nothing is weakened: the real
      # gate is the vitest coverage thresholds above, which run on every
      # trigger, and this step only reports. To have Dependabot pull requests
      # upload too, add CODECOV_TOKEN under Settings → Secrets and variables →
      # Dependabot.
      #
      # Push is unconditional on purpose: a Dependabot auto-merge lands on main
      # as a push by that actor, and skipping it would leave badge #6 showing a
      # pre-merge number.
      - uses: codecov/codecov-action@v7
        if: >-
          github.event_name == 'push' ||
          (github.actor != 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository)
        with:
          files: apps/server/coverage/lcov.info,apps/web/coverage/lcov.info,infra/cdk/coverage/lcov.info,packages/protocol/coverage/lcov.info,packages/vitals-sim/coverage/lcov.info
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # Proves the system a visitor actually gets: the production bundle in a real
  # Chromium, talking cross-origin to a real apps/server process. Two defects
  # reached main with every other job green — a dashboard that could not reach
  # its own API from a browser (C12) and a retention rule that could have been
  # left unwired (C12a) — because nothing verified what the process runs.
  smoke:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The browser is ~90 MB and changes only when Playwright does, so the
      # cache key is the resolved Playwright version rather than the lockfile.
      - id: playwright-version
        run: echo "version=$(pnpm --filter @maekbeat/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maekbeat/web exec playwright install --with-deps chromium
      # System dependencies still need installing on a cache hit.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maekbeat/web exec playwright install-deps chromium
      # Piped through a log so scripts/check-e2e-skips.sh can read the run's own
      # summary. `set -o pipefail` explicitly: GitHub's default shell is
      # `bash -e`, which would otherwise report tee's exit status and swallow a
      # failed suite.
      - run: |
          set -euo pipefail
          pnpm --filter @maekbeat/web test:e2e 2>&1 | tee smoke-e2e.log
      # One skip is correct here and only here: e2e/identity.spec.ts has no
      # revision to compare against when the suite is started from a working
      # tree. The compose job below runs the same six tests with a budget of
      # zero, and the pair is the point — see scripts/check-e2e-skips.sh for why
      # this is not a second copy of e2e/skip-budget.ts.
      - run: bash scripts/check-e2e-skips.sh smoke-e2e.log 1

  # Proves the composed stack: both containers, built from this tree, with the
  # C13 Playwright suite driving them through a real browser.
  #
  # This is the job apps/web/e2e/identity.spec.ts was written for and had never
  # reached. That test skips unless E2E_EXPECTED_REVISION is set, only
  # infra/compose-smoke.sh sets it, and nothing in CI ran that script — so the
  # one test in the suite that asks which build is answering had run on a
  # developer's laptop and nowhere else.
  #
  # It builds its own images through compose rather than consuming the `image`
  # job's artifact, and that is deliberate. infra/compose-smoke.sh runs
  # `up --build` because a run that reuses whatever image happens to be tagged
  # is the exact thing its identity assertions exist to catch; pointing this job
  # at a pre-built tag was mutated locally and failed three assertions at once,
  # identity.spec.ts among them (docs/ai/mutation-log.md). The two jobs
  # therefore run in parallel and prove different things: `image` proves the
  # deploy-target artifact and its cache, this proves the running system.
  compose:
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The same browser cache the smoke job uses, keyed the same way: the
      # download is ~90 MB and changes only when Playwright does.
      - id: playwright-version
        run: echo "version=$(pnpm --filter @maekbeat/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maekbeat/web exec playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maekbeat/web exec playwright install-deps chromium
      # BUILD_REVISION is deliberately not set here. The script takes the
      # revision from `git rev-parse HEAD` and refuses a disagreeing override,
      # because compose builds from the tree regardless of what the variable
      # says — a run with it set three commits behind passed every proof in that
      # file, identity included, and was recorded NOT CAUGHT.
      - run: |
          set -euo pipefail
          bash infra/compose-smoke.sh 2>&1 | tee compose-e2e.log
      # Zero skips, asserted from outside the suite. e2e/skip-budget.ts already
      # compares the run against playwright.config.ts's budget, but that budget
      # is computed from E2E_EXPECTED_REVISION — so if the variable stopped
      # reaching the suite, the budget would become 1, identity.spec.ts would
      # skip, and the reporter would agree with it.
      - run: bash scripts/check-e2e-skips.sh compose-e2e.log 0

  # Proves the deploy-target container image builds from this commit, and is
  # still this commit once it has been built.
  #
  # Until this job existed, every proof in infra/verify-image.sh had run on one
  # laptop and nowhere else — not because the platform was unavailable, but
  # because nothing here invoked the script. It is invoked rather than restated:
  # a CI-shaped copy of those nine proofs would prove the copy passes.
  #
  # The identity check above it is specific to CI. A cached layer serving an
  # older tree is the failure it defends against, and this job is the first
  # place in this repository where layers are cached across builds of different
  # commits — locally the cache belongs to one machine and the tree is in front
  # of you; here it is remote storage addressed by a scope string.
  #
  # The cost, measured rather than estimated: the image is built twice, and the
  # second time costs 15 s. Run 31185142716, on a 4-CPU ubuntu-latest runner
  # with Docker 28.0.4, spent 60 s on the cached buildx build and 15 s on
  # infra/verify-image.sh's pair — its two platforms are the same platform
  # here, so it builds once and hits the daemon cache once, in 0.2 s. The buildx
  # build is the artifact whose identity is asserted; the script makes its own
  # because one that inspects a build has to make one.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # use: false on purpose. setup-buildx-action otherwise makes its
      # docker-container builder the current one, and plain `docker build` —
      # which is what infra/verify-image.sh runs — would then leave its result
      # in the build cache instead of the image store, so the `docker image
      # inspect` on the next line would find nothing.
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false
      # The revision comes from the checked-out tree, and is cross-checked
      # against the SHA the event names. They agree on every trigger this
      # workflow has; a disagreement means the job is building something other
      # than what CI was asked about, which is worth failing on rather than
      # discovering in the label afterwards.
      - id: rev
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "${{ github.sha }}" ]; then
            echo "the checkout is $head but the event names ${{ github.sha }}"
            exit 1
          fi
          echo "sha=$head" >> "$GITHUB_OUTPUT"
      # ignore-error on the export, so a fork pull request and a Dependabot run
      # stay green: neither may write to this repository's Actions cache, and a
      # build that succeeded should not be failed by a cache it was never going
      # to be allowed to fill.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/server.Dockerfile
          platforms: linux/amd64
          build-args: BUILD_REVISION=${{ steps.rev.outputs.sha }}
          tags: maekbeat-server:ci
          load: true
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64,ignore-error=true
      # Near-vacuous on an amd64 runner, where linux/amd64 is what a build with
      # no platform at all would produce — and that is exactly why it is
      # asserted on the artifact rather than read off the line above. The day
      # `runs-on` moves to an arm64 runner, this is the line that notices.
      - run: |
          set -euo pipefail
          arch=$(docker image inspect maekbeat-server:ci --format '{{.Architecture}}')
          if [ "$arch" != "amd64" ]; then
            echo "the built image reports $arch, not the deploy target's amd64"
            exit 1
          fi
          echo "the built image reports $arch"
      - run: bash infra/verify-image-identity.sh maekbeat-server:ci
      - run: bash infra/verify-image.sh

  # Publishes the server image to GHCR, and only ever from main.
  #
  # The gate is decomposed rather than approximated. `image` and `compose` run
  # on every event this workflow accepts; this job runs on a push to
  # refs/heads/main and on nothing else, and `packages: write` is granted here
  # and in no other job. Fork pull requests and Dependabot pull requests stay
  # green because they never reach it — the Codecov step in `tests` carries the
  # scar from getting that decomposition wrong once, and the fix there was the
  # same shape: name the events, do not approximate them with an actor check.
  #
  # Two conditions rather than one, and the second is defence rather than the
  # live gate. `on: push:` is already restricted to `branches: [main]`, so
  # github.ref cannot be anything else today and deleting that half would change
  # no current behaviour. It is written out so that widening the trigger later —
  # a tag, a workflow_dispatch, a release branch — cannot silently start
  # publishing from somewhere nobody meant.
  publish:
    needs: [image, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry paths are lowercase; github.repository is not guaranteed to be.
      - id: ref
        run: |
          set -euo pipefail
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/server" >> "$GITHUB_OUTPUT"
      # Two tags. The SHA tag is immutable and is the one to reference in
      # anything reproducible; `latest` moves. What makes a moving tag safe here
      # rather than a habit: this job needs both `image` and `compose`, so
      # `latest` can only ever move to a commit whose image built for
      # linux/amd64 and passed the nine proofs in infra/verify-image.sh and the
      # identity check on the artifact, and whose composed stack passed the
      # golden replay, all six Playwright tests and the shutdown proof. `main`
      # is the only branch in this repository and `on: push:` accepts no other,
      # so nothing can move it sideways. And it is not a release channel: this
      # repository cuts no version tags, so `latest` means "the newest commit on
      # main that passed CI" — which is stated here rather than implied.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/server.Dockerfile
          platforms: linux/amd64
          build-args: BUILD_REVISION=${{ github.sha }}
          tags: |
            ${{ steps.ref.outputs.image }}:${{ github.sha }}
            ${{ steps.ref.outputs.image }}:latest
          push: true
          builder: ${{ steps.buildx.outputs.name }}
          cache-from: type=gha,scope=server-amd64
          cache-to: type=gha,mode=max,scope=server-amd64,ignore-error=true
      # A job that exits 0 is not an image that arrived. build-push-action
      # leaves no local copy when it pushes, so this is a genuine round trip:
      # pull the SHA tag back out of the registry and make the pulled artifact
      # answer for which commit it is. Everything above this line is the
      # pipeline reporting on itself; this is the registry reporting.
      - run: docker pull "${{ steps.ref.outputs.image }}:${{ github.sha }}"
      - run: bash infra/verify-image-identity.sh "${{ steps.ref.outputs.image }}:${{ github.sha }}"
      # The two tags must be one artifact. They are pushed in a single operation
      # today, so this passes by construction — it is here so that splitting
      # them into two pushes later cannot leave `latest` pointing somewhere else
      # while both tags exist and both resolve.
      - run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{.Manifest.Digest}}'
          }
          sha_digest=$(digest_of "${{ steps.ref.outputs.image }}:${{ github.sha }}")
          latest_digest=$(digest_of "${{ steps.ref.outputs.image }}:latest")
          if [ "$sha_digest" != "$latest_digest" ]; then
            echo "latest is $latest_digest but ${{ github.sha }} is $sha_digest"
            echo "a moving tag pointing at something other than the commit that moved it"
            echo "is worse than no moving tag"
            exit 1
          fi
          echo "both tags resolve to $sha_digest"
      # What a pull actually transfers, asked of the registry instead of
      # inferred from a daemon. `docker image ls` and `docker image inspect
      # --format '{{.Size}}'` mean different things depending on which image
      # store the daemon runs, which is why infra/README.md's two size columns
      # read 305 / 68 on a containerd store and 207 / 207 on this runner's
      # classic one. The manifest is the store-independent answer, and it is
      # recomputed on every publish rather than copied into prose once.
      - run: |
          set -euo pipefail
          image="${{ steps.ref.outputs.image }}"
          tag="$image:${{ github.sha }}"
          # The tag resolves to an OCI index, not a manifest, which is how this
          # step first went red: `.layers` on an index is null.
          # docker/build-push-action attaches a SLSA provenance attestation by
          # default on a registry push, so the index holds two entries — the
          # linux/amd64 image manifest, and an attestation manifest marked
          # `vnd.docker.reference.type: attestation-manifest`.
          #
          # Summing the index would fold the attestation blob into a number
          # labelled "what a pull transfers", and a client pulling this tag
          # fetches the matching platform's manifest and its layers, never the
          # attestation. So resolve the index, select by platform, and sum that
          # manifest — an imprecise sentence about this exact column is what
          # sent someone reading it wrong in the first place.
          digest=$(docker buildx imagetools inspect "$tag" --raw |
            jq -r '.manifests[]
                   | select(.platform.architecture == "amd64" and .platform.os == "linux")
                   | .digest')
          if [ -z "$digest" ]; then
            echo "no linux/amd64 manifest in the index for $tag"
            exit 1
          fi
          docker buildx imagetools inspect "$image@$digest" --raw >platform-manifest.json
          jq -r '.layers[] | "  layer \(.digest[7:19])  \(.size) bytes"' platform-manifest.json
          # -e so a null sum exits non-zero instead of printing "null" into a
          # green log, which is the shape of the bug this step is fixing.
          jq -e -r '[.layers[].size] | add
                    | "linux/amd64 compressed layer total: \(.) bytes (\(. / 1000000 | floor) MB)"' \
            platform-manifest.json

  # Proves the iOS app of C14: SwiftLint clean, the app shell compiles for a
  # simulator, and the MaekbeatKit suite passes with line coverage above its
  # threshold. This job is the whole reason apps/ios is not gate-exempt — it is
  # invisible to `pnpm -r test:coverage`, so it carries its own ratchet
  # (apps/ios/scripts/coverage-gate.sh) and the tests job above asserts that
  # this job still calls it.
  #
  # Since C15 it also runs the gateway integration suite on the macOS host: the
  # resume contract is checked by launching a real apps/server and reading its
  # replies, which an iOS Simulator test cannot do because it cannot spawn a
  # process. That suite is outside the coverage gate for the same reason.
  #
  # macos-latest is billed at nothing here: standard GitHub-hosted runners are
  # free and unmetered for public repositories, macOS included, and only the
  # larger runners are charged (checked 2026-08-05 against GitHub's Actions
  # billing documentation). The image's default Xcode is what runs, echoed by
  # the first step rather than pinned — pinning a version the image later drops
  # breaks CI on Apple's release schedule instead of on a change to this repo.
  # The language does not float with it: the package is swift-tools-version 5.10
  # and the app target builds at SWIFT_VERSION 5.0.
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # The goldens in packages/vitals-sim are decoded by the Swift contract
      # test from this same checkout; nothing is copied into apps/ios.
      - run: |
          xcodebuild -version
          swift --version
      # Pinned and checksummed, the way the docs gates pin prettier and
      # markdownlint. brew's version floats, and a linter that changes under a
      # commit turns a clean diff red for reasons the diff did not cause.
      - name: Install SwiftLint 0.65.0
        env:
          SWIFTLINT_VERSION: 0.65.0
          SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
        run: |
          url="https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          curl -sSLf -o /tmp/swiftlint.zip "$url"
          echo "${SWIFTLINT_SHA256}  /tmp/swiftlint.zip" | shasum -a 256 -c -
          unzip -q /tmp/swiftlint.zip -d /tmp/swiftlint
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
      - run: apps/ios/scripts/lint.sh
      # Before the tests, because the shell is the part no unit test links: a
      # library can be green inside an app that does not compile (C12a's lesson,
      # one target out).
      - run: apps/ios/scripts/build-app.sh
      - run: apps/ios/scripts/test.sh
      # The gateway's resume rule is checked against the server that has to
      # honour it, not against a Swift restatement of what that server does — so
      # this step needs a real apps/server, and therefore Node (C15).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: apps/ios/scripts/integration.sh

  # Proves the repository docs pass the same prettier and markdownlint gates the pre-commit hook enforces.
  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes prettier@3.9.6 --check --ignore-unknown .
      - run: npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#**/node_modules"
